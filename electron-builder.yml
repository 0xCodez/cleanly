appId: app.cleanly.desktop
productName: Cleanly
copyright: Copyright © 2026 Cleanly
directories:
  output: release
  buildResources: build
# main, preload and the Anthropic SDK are bundled by esbuild, so no node_modules ship in the app
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
# no version in file names, so releases/latest/download/<name> links never go stale
artifactName: ${productName}-${os}-${arch}.${ext}
publish: null

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cleanly
  artifactName: ${productName}-setup.${ext}
portable:
  artifactName: ${productName}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID yet: ad-hoc sign so Apple Silicon builds launch once quarantine is cleared.
  # Hardened runtime must stay off with ad-hoc signing, otherwise library validation rejects Electron's frameworks.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDesktopFolderUsageDescription: Cleanly measures your Desktop to show what takes up space.
    NSDocumentsFolderUsageDescription: Cleanly measures your Documents to show what takes up space.
    NSDownloadsFolderUsageDescription: Cleanly looks for old downloads you may want to remove.
dmg:
  title: Cleanly
  sign: false
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }

linux:
  # one PNG per hicolor size (npm run icons); a lone 1024px icon is ignored by the theme
  icon: build/icons
  executableName: cleanly
  category: Utility
  synopsis: A stylish, safe PC cleaner
  description: Cleanly finds caches, old downloads, large files and duplicates, and shows what starts with your computer.
  maintainer: Cleanly <contact@beyond-media.ai>
  vendor: Cleanly
  # Wayland matches the window to cleanly.desktop through the app id Electron takes from desktopName
  syncDesktopName: true
  desktop:
    entry:
      Keywords: cleaner;disk;cache;junk;space;
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
appImage:
  artifactName: ${productName}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-linux-${arch}.${ext}
rpm:
  artifactName: ${productName}-linux-${arch}.${ext}
