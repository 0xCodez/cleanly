appId: app.cleanly.desktop
productName: Cleanly
copyright: Copyright © 2026 Cleanly
directories:
  output: release
  buildResources: build
# SDK JavaScript is bundled by esbuild; Codex's native runtime is copied below.
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
# no version in file names, so releases/latest/download/<name> links never go stale
artifactName: ${productName}-${os}-${arch}.${ext}
publish: null

win:
  extraResources:
    - from: node_modules/@openai/codex-win32-${arch}/vendor
      to: codex-runtime
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cleanly
  artifactName: ${productName}-setup.${ext}
portable:
  artifactName: ${productName}-portable.${ext}

mac:
  extraResources:
    - from: node_modules/@openai/codex-darwin-${arch}/vendor
      to: codex-runtime
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID yet: ad-hoc sign so Apple Silicon builds launch once quarantine is cleared.
  # Hardened runtime must stay off with ad-hoc signing, otherwise library validation rejects Electron's frameworks.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDesktopFolderUsageDescription: Cleanly measures your Desktop to show what takes up space.
    NSDocumentsFolderUsageDescription: Cleanly measures your Documents to show what takes up space.
    NSDownloadsFolderUsageDescription: Cleanly looks for old downloads you may want to remove.
dmg:
  title: Cleanly
  sign: false
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }

linux:
  extraResources:
    - from: node_modules/@openai/codex-linux-${arch}/vendor
      to: codex-runtime
  icon: build/icon.png
  target: [AppImage]
  category: Utility
