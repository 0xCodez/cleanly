appId: app.cleanly.desktop
productName: Cleanly
copyright: Copyright © 2026 Cleanly
directories:
  output: release
  buildResources: build
# main, preload and the Anthropic SDK are bundled by esbuild, so no node_modules ship in the app
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
# no version in file names, so releases/latest/download/<name> links never go stale
artifactName: ${productName}-${os}-${arch}.${ext}
publish: null

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cleanly
  artifactName: ${productName}-setup.${ext}
portable:
  artifactName: ${productName}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID yet: ad-hoc sign so Apple Silicon builds launch once quarantine is cleared.
  # Hardened runtime must stay off with ad-hoc signing, otherwise library validation rejects Electron's frameworks.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDesktopFolderUsageDescription: Cleanly 会测量你的桌面文件夹，以显示哪些内容占用了空间。
    NSDocumentsFolderUsageDescription: Cleanly 会测量你的文稿文件夹，以显示哪些内容占用了空间。
    NSDownloadsFolderUsageDescription: Cleanly 会查找你可能想删除的旧下载文件。
dmg:
  title: Cleanly
  sign: false
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }

linux:
  icon: build/icon.png
  target: [AppImage]
  category: Utility
