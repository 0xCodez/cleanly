<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9c3ff"/>
      <stop offset="0.52" stop-color="#a9d6ff"/>
      <stop offset="1" stop-color="#ffc2dc"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.3" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="7" y1="7" x2="25" y2="25">
      <stop offset="0" stop-color="#2b4cff"/>
      <stop offset="0.55" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff5d8f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="amber" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb547"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <path id="glint" d="M16 2c1.2 7.4 6.6 12.8 14 14-7.4 1.2-12.8 6.6-14 14-1.2-7.4-6.6-12.8-14-14C9.4 14.8 14.8 9.4 16 2z"/>
  </defs>

  <rect x="112" y="124" width="800" height="800" rx="180" fill="#3a3f8f" opacity="0.2" filter="url(#drop)"/>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#wash)"/>
    <circle cx="232" cy="808" r="170" fill="#ffffff" opacity="0.22"/>
    <circle cx="232" cy="808" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="826" cy="236" r="78" fill="#ffffff" opacity="0.18"/>
    <circle cx="826" cy="236" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5"/>
    <path d="M100 100h824v330C760 380 560 360 100 470z" fill="url(#gloss)"/>
  </g>

  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g transform="translate(512 536) scale(16) translate(-16 -16)" opacity="0.45" filter="url(#glow)">
    <use href="#glint" fill="url(#brand)"/>
  </g>
  <g transform="translate(512 512) scale(16) translate(-16 -16)">
    <use href="#glint" fill="url(#brand)"/>
    <use href="#glint" fill="url(#sheen)"/>
  </g>

  <circle cx="656" cy="378" r="40" fill="#ffb547" opacity="0.55" filter="url(#soft)"/>
  <circle cx="656" cy="368" r="38" fill="url(#amber)"/>
  <circle cx="645" cy="356" r="11" fill="#ffffff" opacity="0.55"/>
</svg>
